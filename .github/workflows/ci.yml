name: Project checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-portable:
    name: linux-portable
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install LLVM 21 and Ruff 0.16.8
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-snapshot.gpg
          echo 'deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y clang-format-21 clang-tidy-21
          python3 -m venv .venv-check
          .venv-check/bin/pip install ruff==0.16.8
      - name: Inspect formatting, links and content
        run: |
          .venv-check/bin/ruff check tools
          .venv-check/bin/ruff format --check tools
          python3 tools/check_links.py
          python3 tools/stage_content.py
          python3 tools/stage_content.py --check
      - name: Inspect changed whitespace
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --check "origin/$BASE_REF...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi
      - name: Build, lint and run portable scenarios
        run: |
          cmake --preset dev
          cmake --build --preset dev -j 4
          python3 tools/check_cpp.py
          ctest --preset dev
          build/dev/odr_tool --script game/scenarios/blacksmith_mine.jsonl > build/headless-result.json
          python3 -c 'import json; actual=json.load(open("build/headless-result.json")); expected=json.load(open("game/scenarios/blacksmith_mine.expected.json")); assert actual == expected'
      - name: Sanitizer scenarios
        run: |
          cmake --preset sanitizers
          cmake --build --preset sanitizers -j 4
          ASAN_OPTIONS=detect_leaks=1 ctest --preset sanitizers

  mac-unreal:
    name: mac-unreal
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'codex/'))
    runs-on: [self-hosted, macOS, ARM64, odr-mac]
    timeout-minutes: 60
    env:
      UE_ROOT: /Volumes/UE_5_8_APFS
    steps:
      - uses: actions/checkout@v4
      - name: Build portable library and stage game data
        run: |
          cmake --preset ue-release
          cmake --build --preset ue-release -j 4
          python3 tools/stage_content.py
          python3 tools/stage_content.py --check
      - name: Build Unreal Editor target
        run: |
          "$UE_ROOT/Engine/Build/BatchFiles/Mac/Build.sh" OpenDynamicRPGEditor Mac Development -project="$PWD/Unreal/OpenDynamicRPG.uproject" -waitmutex -NoHotReload
      - name: Unreal automation
        run: |
          "$UE_ROOT/Engine/Binaries/Mac/UnrealEditor-Cmd" "$PWD/Unreal/OpenDynamicRPG.uproject" -unattended -nullrhi -nosplash -ExecCmds='Automation RunTests ODR.BlacksmithMine;Quit' -ReportExportPath="$PWD/build/reports/unreal"
          python3 tools/check_unreal_report.py
      - name: Package and run unattended mine smoke
        run: |
          "$UE_ROOT/Engine/Build/BatchFiles/RunUAT.sh" BuildCookRun -project="$PWD/Unreal/OpenDynamicRPG.uproject" -platform=Mac -clientconfig=Development -build -cook -stage -pak -package -archive -archivedirectory="$PWD/build/package" -unattended -nop4
          "$PWD/build/package/Mac/OpenDynamicRPG.app/Contents/MacOS/OpenDynamicRPG" -odrsmoke -unattended -nullrhi -nosplash > build/packaged-smoke.log 2>&1
          rg 'ODR_SMOKE_PASS' build/packaged-smoke.log
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-unreal-diagnostics
          path: |
            Unreal/Saved/Logs/
            build/reports/unreal/
            build/packaged-smoke.log
          if-no-files-found: ignore
